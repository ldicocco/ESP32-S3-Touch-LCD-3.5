[package]
edition      = "2024"
name         = "esp32-s3-touch-lcd-3-5"
rust-version = "1.88"
version      = "0.1.0"
default-run  = "esp32-s3-touch-lcd-3-5"

[[bin]]
name = "esp32-s3-touch-lcd-3-5"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32s3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3", "log-04"] }
log                    = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
esp-backtrace = { version = "0.19.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.17.0", features = ["esp32s3", "log-04"] }

critical-section = "1.2.0"
embedded-hal     = "1"
esp-alloc        = { version = "0.10.0", features = ["esp32s3"] }

# Wi-Fi: esp-radio driver + embassy-net (DHCP/TCP/UDP) on smoltcp.
esp-radio = { version = "0.18.0", features = [
  "esp-alloc",
  "esp32s3",
  "log-04",
  "unstable",
  "wifi",
] }
embassy-net = { version = "0.9.1", features = [
  "dhcpv4",
  "dns",
  "log",
  "medium-ethernet",
  "tcp",
  "udp",
] }
smoltcp = { version = "0.13.0", default-features = false, features = [
  "log",
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

# LVGL UI. Pinned exact: oxivgl is pre-1.0 and explicitly not API-stable.
# `esp32s3` transitively enables oxivgl's `esp-hal` feature (flush pipeline).
oxivgl     = { version = "=0.7.0", features = ["esp32s3", "log-04"] }
# Raw LVGL bindings, for the few calls oxivgl doesn't wrap.
oxivgl_sys = { package = "oxivgl-sys", version = "=0.2.4", default-features = false }
static_cell      = "2.1.1"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
